name: watnow_autumn_team3_front
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_svg: ^2.0.9

  # iOS 風アイコン
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  # Material Icons を使う設定
  uses-material-design: true

  # ✅ 画像・アイコンを使うフォルダ
  assets:
    - assets/images/
    - assets/icons/

  # ✅ カスタムフォント
  fonts:
    - family: Banana
      fonts:
        - asset: assets/fonts/YDWbananaslipplus.otf

    - family: Building
      fonts:
        - asset: assets/fonts/Buildingsandundertherailwaytracksfree_ver.otf
